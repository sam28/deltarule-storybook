<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up -- Ordly</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-card__brand" style="text-decoration: none; color: inherit;">
      <span class="app-sidebar__brand-mark">O</span>
      Ordly
    </a>
    <div class="card">
      <h1>Sign up</h1>
      <!-- ECART VOLONTAIRE (libelle) : "Sign in" ici, "Log in" sur
           login.html -- meme action, deux libelles differents. -->
      <p class="auth-subtitle">Enter your email and password to create an account. Already have an account? <a href="login.html">Sign in</a></p>

      <form>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@company.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="8 characters minimum" />
        </div>
        <div class="field">
          <label for="password-confirm">Confirm password</label>
          <input type="password" id="password-confirm" placeholder="8 characters minimum" />
        </div>

        <!-- ECART VOLONTAIRE (oubli) : pas de case "I agree to the terms of
             service" -- omission frequente entre un flow d'inscription
             specifie et son implementation reelle. -->

        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 20px;">Create account</button>
      </form>

      <div class="divider-label">Or continue with</div>

      <div class="social-row">
        <button type="button" class="btn btn-outline">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.2c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.08 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.93.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3Z"></path></svg>
          GitHub
        </button>
        <button type="button" class="btn btn-outline">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z"></path></svg>
          Facebook
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
